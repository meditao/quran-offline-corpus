name: Audit QAC root snapshots

on:
  workflow_dispatch:
  push:
    paths:
      - '08_scripts/compare_qac_snapshots.py'
      - '.github/workflows/audit-qac-root-snapshots.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare old and current QAC root snapshots
        run: python 08_scripts/compare_qac_snapshots.py

      - name: Commit audit report
        run: |
          git config user.name "quran-offline-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_indices/audits/qac_1651_vs_1642.json 03_indices/audits/qac_1651_vs_1642.md
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Audit QAC 1651 vs 1642 root snapshots"
          git push
