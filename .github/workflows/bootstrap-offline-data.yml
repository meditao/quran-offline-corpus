name: Bootstrap verified offline Quran data

on:
  workflow_dispatch:
  push:
    paths:
      - SOURCE_TERMS_ACCEPTED.md

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify explicit source-term acceptance marker
        run: |
          test -f SOURCE_TERMS_ACCEPTED.md
          grep -q "Tanzil" SOURCE_TERMS_ACCEPTED.md
          grep -q "QAC" SOURCE_TERMS_ACCEPTED.md
          grep -q "Açık Kuran" SOURCE_TERMS_ACCEPTED.md

      - name: Validate pinned Tanzil
        run: python 08_scripts/validate_tanzil.py

      - name: Validate pinned Quranic Arabic Corpus and rebuild indices
        run: |
          python 08_scripts/validate_qac.py
          python 08_scripts/build_qac_indices.py

      - name: Build Tanzil-QAC alignment audit
        run: python 08_scripts/build_tanzil_qac_alignment.py

      - name: Commit verified generated outputs
        run: |
          git config user.name "quran-offline-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_raw/tanzil/validation.local.json 03_indices/generated 03_indices/audits/tanzil_qac_alignment.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Refresh verified core indices and alignment"
          git push
