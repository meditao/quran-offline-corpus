name: Build Amn verb syntax audit

on:
  workflow_dispatch:
  push:
    paths:
      - '08_scripts/analyze_amn_verb_syntax.py'
      - '.github/workflows/build-amn-syntax.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Amn verb syntax audit
        run: python 08_scripts/analyze_amn_verb_syntax.py
      - name: Commit generated audit
        run: |
          git config user.name "quran-offline-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 07_analyses/generated/root_profiles/Amn/verb_syntax
          if git diff --cached --quiet; then
            echo "No syntax-audit changes."
            exit 0
          fi
          git commit -m "Build Amn verb syntax audit"
          git push
