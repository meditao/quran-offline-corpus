name: Build Hebrew lexical index

on:
  workflow_dispatch:
  push:
    paths:
      - '08_scripts/build_hebrew_lexicon_index.py'
      - '04_lexicons/semitic/VENDOR_LOCK.json'
      - '.github/workflows/build-hebrew-lexicon-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned Hebrew lexical index
        run: python 08_scripts/build_hebrew_lexicon_index.py
      - name: Commit generated Hebrew index
        run: |
          git config user.name "quran-offline-corpus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04_lexicons/generated/hebrew_lexical_index.tsv 04_lexicons/generated/hebrew_lexical_index.manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Build pinned Hebrew lexical index"
          git push
